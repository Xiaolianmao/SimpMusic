name: 发布 Windows 11 简体中文完整便携包（含扩展）
on:
  push:
    branches:
      - "feat/complete-zh-cn-browser-login"
    paths:
      - ".github/workflows/publish-win11-complete-zh.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 取得最新版扩展
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 下载已通过测试的 Windows 完整播放器
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43831370267 -R Xiaolianmao/SimpMusic -n SimpMusic-zh-CN-Windows-portable -D download
          if ($LASTEXITCODE -ne 0) { throw '下载构建成品失败' }
      - name: 合并播放器、扩展与中文说明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath 'download/SimpMusic-zh-CN-Windows-portable.zip' -DestinationPath 'package' -Force
          $app = 'package/SimpMusic'
          foreach ($file in @("$app/SimpMusic.exe", "$app/app/SimpMusic.cfg", "$app/runtime/bin/server/jvm.dll")) {
            if (!(Test-Path $file)) { throw "必要的运行文件缺失：$file" }
          }
          New-Item -ItemType Directory -Force "$app/browser-extension" | Out-Null
          Copy-Item 'browser-extension/manifest.json' "$app/browser-extension/manifest.json"
          Copy-Item 'browser-extension/popup.html' "$app/browser-extension/popup.html"
          Copy-Item 'browser-extension/popup.css' "$app/browser-extension/popup.css"
          Copy-Item 'browser-extension/popup.js' "$app/browser-extension/popup.js"
          Copy-Item 'browser-extension/README.md' "$app/browser-extension/中文安装说明.md"
          $manifest = Get-Content "$app/browser-extension/manifest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.version -ne '0.2.0') { throw '浏览器扩展版本不正确' }
          @'
          SimpMusic Windows 11 完整简体中文便携版（内含浏览器扩展）
          
          全新安装：
          1. 退出所有旧版 SimpMusic 进程，再删除旧的程序文件夹。个人数据通常保存在用户目录，删除程序文件夹并不清空用户数据。
          2. 将本压缩包完整解压至新文件夹，保留内部 SimpMusic 文件夹结构。
          3. 建议先双击 SimpMusic/SimpMusic-Proxy-7897.cmd（Clash 混合代理启动入口，默认端口 7897）。若不使用代理，改用 SimpMusic-Win11-Start.cmd。
          4. 谷歌浏览器打开 chrome://extensions，开启开发者模式。
          5. 在扩展管理页面移除旧版 SimpMusic 扩展，再点击“加载已解压的扩展程序”。
          6. 选择本包内 SimpMusic/browser-extension 文件夹，完成本地扩展安装。
          7. 在播放器登录页面选择“开始导入浏览器登录”，点击“复制验证码”。
          8. 在浏览器扩展弹窗粘贴新验证码，选择导入 YouTube（优兔音乐）或 Spotify（声田音乐）。
          9. 如浏览器请求本地网络权限，请确认来自本扩展后允许。
          
          重要：
          - 旧扩展不会因为删除旧程序文件夹而自动卸载，必须在扩展管理页面移除。
          - 一次性验证码约 2 分钟有效，重新导入时需要新的验证码。
          - 代理地址 127.0.0.1，端口填写正在运行的 Clash 实际混合端口，例如 7897；使用 HTTP（超文本传输协议）模式。
          - 如果歌曲有信息但封面不加载、没有声音，请使用 SimpMusic-Proxy-7897.cmd 从头启动。此启动方式会为原生媒体解码器设置仅本次有效的 HTTP/HTTPS 代理环境变量。
          - 如果 Clash 的混合端口不是 7897，可在命令提示符运行 SimpMusic-Proxy-7897.cmd 端口号（例如 7898）。也可在 Clash 中开启 TUN（虚拟网卡）模式，供不读取软件代理设置的底层组件使用。
          - 关键修复：PipePipe 与 BravePipe 音源解析器之前始终直连，导致首页和封面正常但报 No URL found（找不到播放地址）；现在解析器、音源下载器以及播放地址的 HEAD 有效性检查都明确使用软件设置的代理。
          - 保留绑定 127.0.0.1 的本机 HTTPS 音频转发服务，将音乐数据通过 Clash HTTP 代理下载，再由原生 mpv 解码，不需要开启 TUN。支持 HTTP 范围请求，HLS 直播源仍按原路径处理。
          - 正常音乐播放和封面使用当前规则代理，不会修改系统代理，也不会让其他程序走全局代理。
          - 自动测试和 Windows 构建已通过；真正的网络节点、音源有效性和音频播放仍需在用户 Windows 11 本机确认。
          - 不包含账户、密码或真实登录凭据。
          - 已通过自动编译和测试，浏览器真实登录仍需在 Windows 11 本机验收。
          '@ | Set-Content -LiteralPath "$app/首先阅读-完整使用说明.txt" -Encoding UTF8
          $asset = 'SimpMusic-Win11-zh-CN-full-with-extension.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $asset -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $asset).Path)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($name in @(
              'SimpMusic/SimpMusic.exe',
              'SimpMusic/SimpMusic-Proxy-7897.cmd',
              'SimpMusic/browser-extension/manifest.json',
              'SimpMusic/browser-extension/popup.js',
              'SimpMusic/首先阅读-完整使用说明.txt'
            )) {
              if ($name -notin $names) { throw "完整包检查失败：$name" }
            }
            Write-Host "Files in ZIP: $($names.Count)"
          } finally { $zip.Dispose() }
          Get-FileHash $asset -Algorithm SHA256
      - name: 上传 GitHub 工作流备用下载
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Win11-zh-CN-full-with-extension
          path: SimpMusic-Win11-zh-CN-full-with-extension.zip
          retention-days: 30
          if-no-files-found: error
      - name: 发布 GitHub Release 直链下载
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v2.6.0-zh-win11-20261116.4'
          $asset = 'SimpMusic-Win11-zh-CN-full-with-extension.zip'
          @'
          Windows 11 简体中文完整便携测试版，含播放器、运行环境、简体中文界面、图片代理、音频本机中继，修复 PipePipe 与 BravePipe 音源解析器和音源地址有效性检查未走 Clash 代理造成的 No URL found（无法解析播放地址）。不需要 TUN 或全局代理。保留浏览器导入、验证码复制和浏览器扩展 0.2.0。
          Clash 混合代理端口默认为 7897 的用户建议从 SimpMusic-Proxy-7897.cmd 启动。实际音乐播放需在用户 Windows 环境验收。
          已通过 Windows 构建和桌面自动测试，仍需在用户电脑验证真实登录。
          下载后解压并阅读“首先阅读-完整使用说明.txt”。
          '@ | Set-Content -LiteralPath release-notes.txt -Encoding UTF8
          gh release view $tag -R Xiaolianmao/SimpMusic *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber -R Xiaolianmao/SimpMusic
          } else {
            gh release create $tag $asset -R Xiaolianmao/SimpMusic --target $env:GITHUB_SHA --title 'SimpMusic Win11 简体中文音源解析修复测试版（含扩展）' --notes-file release-notes.txt --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw '发布下载页面失败' }
          gh release view $tag -R Xiaolianmao/SimpMusic --json url,assets
          if ($LASTEXITCODE -ne 0) { throw '无法核查发布成品' }
